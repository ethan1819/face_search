[project]
name = "local-face-photo-search"
version = "0.1.0"
description = "完全本地运行的人脸照片检索系统"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<4.11",
  "pillow>=10,<13",
  "insightface>=0.7.3",
  "onnxruntime>=1.18,<2",
  "pyside6>=6.7,<7",
]

[project.optional-dependencies]
face = [
  "insightface>=0.7.3",
  "onnxruntime>=1.18,<2",
]
gpu = [
  "insightface>=0.7.3",
  "onnxruntime-gpu>=1.18,<2",
]
gui = ["pyside6>=6.7,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
