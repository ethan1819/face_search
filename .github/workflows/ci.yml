name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-
            venv-${{ runner.os }}-

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: uv pip install --python .venv/bin/python -r requirements.txt pytest pytest-cov

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: uv pip install --python .venv/Scripts/python.exe -r requirements.txt pytest pytest-cov

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest -q

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pytest -q
        shell: pwsh
