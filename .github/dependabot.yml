version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-core:
        patterns:
          - "numpy"
          - "scipy"
          - "pillow"
          - "opencv-python"
      inference:
        patterns:
          - "insightface"
          - "onnxruntime*"
      gui:
        patterns:
          - "pyside6"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
